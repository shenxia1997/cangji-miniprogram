<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1175px; height:500px; overflow:hidden; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:#0E1729;
    position:relative;
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:56px 56px;
  }
  .glow {
    position:absolute; width:620px; height:620px; border-radius:50%;
    right:-180px; top:-220px;
    background:radial-gradient(circle, rgba(47,91,234,0.38) 0%, rgba(47,91,234,0) 68%);
  }
  .chart { position:absolute; right:0; bottom:0; opacity:0.5; }
  .wrap { position:absolute; left:72px; top:74px; width:760px; }
  .eyebrow {
    font-size:19px; color:#7C8DB5; letter-spacing:4px; font-weight:400;
    margin-bottom:30px;
  }
  .eyebrow b { color:#4D7CFF; font-weight:700; }
  .nums { display:flex; align-items:baseline; white-space:nowrap; }
  .n1 { font-size:96px; font-weight:800; color:#FFFFFF; letter-spacing:-2px; line-height:1; }
  .arrow { font-size:62px; color:#4D7CFF; margin:0 22px; font-weight:300; }
  .n2 { font-size:96px; font-weight:800; color:#4D7CFF; letter-spacing:-2px; line-height:1; }
  .rule { width:96px; height:4px; background:#4D7CFF; margin:34px 0 26px; border-radius:2px; }
  .sub { font-size:27px; color:#C6D0E4; line-height:1.6; letter-spacing:0.5px; }
  .sub em { font-style:normal; color:#FFFFFF; font-weight:700; }
  .foot {
    position:absolute; left:72px; bottom:34px;
    font-size:16px; color:#5A6B8C; letter-spacing:2px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <svg class="chart" width="430" height="300" viewBox="0 0 430 300">
    <polyline points="0,268 54,240 108,252 162,196 216,214 270,150 324,168 378,96 430,58"
              fill="none" stroke="#4D7CFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <circle cx="430" cy="58" r="6" fill="#4D7CFF" opacity="0.9"/>
  </svg>
  <div class="wrap">
    <div class="eyebrow"><b>仓记</b> · 持仓成本</div>
    <div class="nums">
      <span class="n1">48.545</span>
      <span class="arrow">&#8594;</span>
      <span class="n2">49.058</span>
    </div>
    <div class="rule"></div>
    <div class="sub">卖掉一笔赚钱的单子<br>持仓成本为什么<em>反而涨了</em></div>
  </div>
  <div class="foot">一次卖出之后，账本里发生了什么</div>
</body>
</html>
