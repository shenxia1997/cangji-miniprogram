prohibitions:
  - 浮点金额运算
  - pages/components 内计算成本与盈亏
  - 建 lots 集合
  - 用顺序号标识批次
  - pages 直接调 wx.cloud
  - 存储加权单价
  - 新增第三方依赖
  - 修改 §2 类型定义

stop_conditions:
  - 契约与实现冲突且不改进契约写不下去
  - 金标准夹具算不出期望值
  - 微信平台限制导致任务不可行
  - 不变量随机测试失败且无法判定归因
