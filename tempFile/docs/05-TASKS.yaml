invariants:
  - id: I1
    name: 份额守恒
    expr: "position.quantity == sum(buy.quantity) - sum(sell.quantity)"
  - id: I2
    name: 批次守恒
    expr: "sum(lot.remainQuantity) == position.quantity"
  - id: I3
    name: 成本守恒
    expr: "sum(costOut) + sum(lot.remainCost) == initialCostTotal"
  - id: I4
    name: 总额守恒
    expr: "sum(realizedPnl) == sum(sell.amount) - sum(costOut) - sum(sell.feeTotal)"
  - id: I5
    name: 删除幂等
  - id: I6
    name: 顺序无关
    expr: "shuffle(txns) -> replay -> 结果一致"

